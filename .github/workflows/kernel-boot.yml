name: x86-64 kernel boot
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc binutils nasm grub-pc-bin grub-common xorriso mtools qemu-system-x86 python3
      - name: Verify dependencies
        run: make toolchain-check
      - name: Build Multiboot2 kernel and ISO
        run: make clean all check
      - name: Inspect interrupt-return disassembly
        run: |
          nm -n build/kernel.elf | grep -E 'irq0_stub|irq_dispatch|scheduler_on_tick|task_a|task_b'
          objdump -d build/kernel.elf | grep -B 12 -A 3 -E '\\biretq?\\b'
      - name: Boot kernel in QEMU
        run: make test
